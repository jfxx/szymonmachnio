<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio fotograficzne Szymona Machnio">
  <title>Szymon Machnio — Fotografia</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <svg class="noise-filter" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>

  <header class="header" id="header">
    <nav class="nav nav--left" aria-label="Nawigacja główna">
      <a href="#works" class="btn">Works</a>
      <a href="#about" class="btn">About me</a>
      <a href="#contact" class="btn">Contact</a>
    </nav>

    <div class="nav nav--right">
      <a href="https://www.instagram.com/szymon_machnie_photo/" class="btn btn--icon" target="_blank"
        rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <button type="button" class="btn btn--icon" id="theme-toggle" aria-label="Odwróć motyw">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="currentColor" />
          <path d="M12 3 A9 9 0 0 1 12 21 Z" class="theme-toggle-contrast" />
        </svg>
      </button>
    </div>
  </header>

  <div class="page" id="page">

    <main>
      <section class="hero" id="home">
        <h1 class="hero__title">SZYMON MACHNIO</h1>
        <div class="scroll-hint" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 5v14M6 13l6 6 6-6" />
          </svg>
        </div>
      </section>

      <section class="section section--full" id="works">
        <h2 class="section__title">Works</h2>
        <div class="gallery">
          <div class="gallery__item" role="button" tabindex="0" aria-label="Powiększ zdjęcie 1">
            <img src="assets/images/Featured Works/first.webp" alt="Featured work 1" loading="lazy">
          </div>
          <div class="gallery__item" role="button" tabindex="0" aria-label="Powiększ zdjęcie 2">
            <img src="assets/images/Featured Works/second.webp" alt="Featured work 2" loading="lazy">
          </div>
          <div class="gallery__item" role="button" tabindex="0" aria-label="Powiększ zdjęcie 3">
            <img src="assets/images/Featured Works/third.webp" alt="Featured work 3" loading="lazy">
          </div>
          <div class="gallery__item" role="button" tabindex="0" aria-label="Powiększ zdjęcie 4">
            <img src="assets/images/Featured Works/fourth.webp" alt="Featured work 4" loading="lazy">
          </div>
        </div>
        <div class="section__cta">
          <a href="categories.html" class="btn btn--cta">
            Wszystkie kategorie
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>
      </section>

      <section class="section section--centered section--full" id="about">
        <h2 class="section__title">About me</h2>
        <p class="section__text">
          Fotograf specjalizujący się w portretach, dokumentacji i wizualnych opowieściach.
          Każdy kadr to świadoma decyzja — światło, kompozycja i moment.
        </p>
      </section>

      <div class="section-divider"></div>

      <section class="section section--centered section--full" id="contact">
        <h2 class="section__title">Contact</h2>
        <p class="section__text">
          <a href="mailto:szymonmachniofoto@gmail.com">szymonmachniofoto@gmail.com</a>
        </p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__copy">&copy; 2026 Szymon Machnio</p>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Powiększone zdjęcie">
    <div class="lightbox__toolbar">
      <span class="lightbox__counter" id="lightbox-counter"></span>
      <button type="button" class="lightbox__btn" id="lightbox-fullscreen" aria-label="Pełny ekran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3" />
        </svg>
      </button>
      <button type="button" class="lightbox__btn" id="lightbox-close" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <button type="button" class="lightbox__nav lightbox__prev" id="lightbox-prev" aria-label="Poprzednie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div class="lightbox__img-wrap" id="lightbox-wrap">
      <img class="lightbox__img" id="lightbox-img" src="" alt="">
    </div>
    <button type="button" class="lightbox__nav lightbox__next" id="lightbox-next" aria-label="Następne">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
