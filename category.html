<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Category Gallery — Szymon Machnio">
  <meta property="og:title" content="Szymon Machnio - Gallery">
  <meta property="og:description"
    content="Browse Szymon Machnio's photo gallery — portraits, landscapes, astrophotography, and more.">
  <meta property="og:image" content="assets/images/Featured-Works/first.webp">
  <meta property="og:type" content="website">
  <title>Szymon Machnio - Categories</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1">
</head>

<body>


  <header class="header" id="header">
    <nav class="nav nav--left" data-i18n-aria="aria.nav" aria-label="Nawigacja">
      <a href="categories.html" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="width:1rem;height:1rem;margin-right:0.4rem" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        <span data-i18n="category.backToCategories">Kategorie</span>
      </a>
    </nav>

    <div class="nav nav--right">
      <a href="https://www.instagram.com/szymon_machnie_photo/" class="btn btn--icon" target="_blank"
        rel="noopener noreferrer" data-i18n-aria="aria.instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <button type="button" class="btn btn--icon" id="theme-toggle" data-i18n-aria="aria.theme"
        aria-label="Przełącz motyw">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="currentColor" />
          <path d="M12 3 A9 9 0 0 1 12 21 Z" class="theme-toggle-contrast" />
        </svg>
      </button>
      <button type="button" class="btn btn--lang" id="lang-toggle" data-i18n-aria="aria.lang" aria-label="Zmień język">
        <span class="lang-toggle__label">EN</span>
      </button>
    </div>
  </header>

  <div class="page" id="page">
    <main>
      <noscript>
        <div style="text-align:center;padding:4rem 2rem;">
          <h2 style="margin-bottom:1rem;">Wymagany JavaScript / JavaScript required</h2>
          <p>Aby przeglądać galerię, włącz obsługę JavaScript w przeglądarce.</p>
          <p style="margin-top:0.5rem;">To view the gallery, please enable JavaScript in your browser.</p>
          <p style="margin-top:1.5rem;"><a href="categories.html">← Wróć do kategorii / Back to categories</a></p>
          <hr style="margin:2rem auto;max-width:400px;border:none;border-top:1px solid #ccc;">
          <p style="margin-bottom:1rem;">Galerie / Galleries:</p>
          <ul style="list-style:none;padding:0;">
            <li><a href="category.html?cat=arctic">Arktyka / Arctic</a></li>
            <li><a href="category.html?cat=astro">Astro</a></li>
            <li><a href="category.html?cat=automotive">Samochody / Automotive</a></li>
            <li><a href="category.html?cat=blue">Niebiesko / Blue</a></li>
            <li><a href="category.html?cat=landscapes">Krajobrazy / Landscapes</a></li>
            <li><a href="category.html?cat=portraits">Portrety / Portraits</a></li>
            <li><a href="category.html?cat=interiors">Wnętrza / Interiors</a></li>
            <li><a href="category.html?cat=other">Inne / Other</a></li>
          </ul>
        </div>
      </noscript>
      <section class="category-hero">
        <h1 class="category-hero__title" id="category-title">Kategoria</h1>
        <p class="category-hero__subtitle" id="category-subtitle"></p>
      </section>

      <div class="category-gallery" id="category-gallery"></div>

      <div class="category-nav">
        <a href="categories.html" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          <span data-i18n="category.allCategories">Wszystkie kategorie</span>
        </a>
        <a href="index.html" class="btn" data-i18n="category.mainPage">Strona główna</a>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__copy" id="footer-year" data-i18n="footer.copy">&copy; Szymon Machnio</p>
    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria="aria.lightbox"
    aria-label="Powiększone zdjęcie">
    <div class="lightbox__toolbar">
      <span class="lightbox__counter" id="lightbox-counter"></span>
      <button type="button" class="lightbox__btn" id="lightbox-fullscreen" data-i18n-aria="aria.fullscreen"
        aria-label="Pełny ekran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3" />
        </svg>
      </button>
      <button type="button" class="lightbox__btn" id="lightbox-close" data-i18n-aria="aria.close" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <button type="button" class="lightbox__nav lightbox__prev" id="lightbox-prev" data-i18n-aria="aria.prev"
      aria-label="Poprzednie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div class="lightbox__img-wrap" id="lightbox-wrap">
      <img class="lightbox__img" id="lightbox-img" src="" alt="">
    </div>
    <button type="button" class="lightbox__nav lightbox__next" id="lightbox-next" data-i18n-aria="aria.next"
      aria-label="Następne">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>

  <script src="js/i18n.js?v=1"></script>
  <script src="js/theme.js?v=1"></script>
  <script src="js/categories-data.js?v=1"></script>
  <script src="js/lightbox.js?v=1"></script>
  <script src="js/masonry.js?v=1"></script>
  <script>
    /* ── i18n ── */
    initI18n();

    /* ── Footer year ── */
    (function () {
      var el = document.querySelector(".footer__copy");
      if (el) {
        el.textContent = "\u00A9 " + new Date().getFullYear() + " Szymon Machnio";
      }
    })();

    /* ── Render Gallery ── */
    const params = new URLSearchParams(window.location.search);
    const catKey = params.get("cat");
    const cat = CATEGORIES[catKey];

    const titleEl = document.getElementById("category-title");
    const subtitleEl = document.getElementById("category-subtitle");
    const galleryEl = document.getElementById("category-gallery");

    if (cat) {
      titleEl.textContent = t(cat.titleKey);
      subtitleEl.textContent = t(cat.subtitleKey);
      document.title = t(cat.titleKey) + " — Szymon Machnio";

      const catTitle = t(cat.titleKey);
      const fileList = getCategoryFileList(catKey);

      fileList.forEach((name, i) => {
        const src = CATEGORIES_BASE_PATH + cat.folder + "/" + name + ".webp";
        const src480 = CATEGORIES_BASE_PATH + cat.folder + "/" + name + "-480w.webp";
        const src800 = CATEGORIES_BASE_PATH + cat.folder + "/" + name + "-800w.webp";
        const alt = catTitle + " " + (i + 1);
        imageSources.push({ src, alt });

        const item = document.createElement("div");
        item.className = "category-gallery__item";
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");
        item.setAttribute("aria-label", alt);
        const img = document.createElement("img");
        img.src = src;
        img.srcset = src480 + " 480w, " + src800 + " 800w, " + src + " 1200w";
        img.sizes = "(max-width: 480px) 100vw, (max-width: 768px) 50vw, (max-width: 1024px) 33vw, 25vw";
        img.alt = alt;
        img.loading = "eager";
        img.addEventListener("error", function () {
          item.remove();
          // Remove from imageSources so lightbox indexes stay correct
          const idx = imageSources.findIndex(s => s.src === src);
          if (idx !== -1) imageSources.splice(idx, 1);
          // Re-bind click indexes after removal
          rebindGalleryClicks();
        });
        item.appendChild(img);
        galleryEl.appendChild(item);

        item.addEventListener("click", () => openLightbox(i));
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openLightbox(i);
          }
        });
      });

      /* ── Inject JSON-LD structured data for SEO ── */
      const jsonLd = {
        "@context": "https://schema.org",
        "@type": "ImageGallery",
        "name": catTitle + " — Szymon Machnio Photography",
        "description": t(cat.subtitleKey),
        "author": {
          "@type": "Person",
          "name": "Szymon Machnio"
        },
        "image": imageSources.map(s => s.src)
      };
      const ldScript = document.createElement("script");
      ldScript.type = "application/ld+json";
      ldScript.textContent = JSON.stringify(jsonLd);
      document.head.appendChild(ldScript);

      /* ── Activate masonry layout ── */
      var masonry = initMasonry(".category-gallery", ".category-gallery__item");
    } else {
      titleEl.textContent = t("category.notFound");
      subtitleEl.textContent = t("category.notFoundDesc");
    }

    /* Re-bind gallery click events after an image is removed */
    function rebindGalleryClicks() {
      const items = galleryEl.querySelectorAll(".category-gallery__item");
      items.forEach((item, i) => {
        // Clone to remove old listeners
        const newItem = item.cloneNode(true);
        item.parentNode.replaceChild(newItem, item);
        newItem.addEventListener("click", () => openLightbox(i));
        newItem.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openLightbox(i);
          }
        });
      });
      /* Recalculate masonry after item removal */
      if (masonry) masonry.layout();
    }

    // Update title and subtitle on lang change
    function updateCategoryTexts() {
      if (cat) {
        titleEl.textContent = t(cat.titleKey);
        subtitleEl.textContent = t(cat.subtitleKey);
        document.title = t(cat.titleKey) + " — Szymon Machnio";
      } else {
        titleEl.textContent = t("category.notFound");
        subtitleEl.textContent = t("category.notFoundDesc");
      }
    }

    document.addEventListener("langchange", updateCategoryTexts);
  </script>
</body>

</html>
