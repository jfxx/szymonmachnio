<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galeria kategorii — Szymon Machnio Fotografia">
  <meta property="og:title" content="Galeria — Szymon Machnio Photography">
  <meta property="og:description" content="Przeglądaj galerię zdjęć Szymona Machnio — portrety, krajobrazy, astrofotografia i więcej.">
  <meta property="og:image" content="assets/images/Featured-Works/first.webp">
  <meta property="og:type" content="website">
  <title>Szymon Machnio - Kategorie</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .category-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 45vh;
      padding: clamp(7rem, 14vw, 11rem) clamp(1.5rem, 6vw, 4rem) clamp(2rem, 6vw, 3rem);
    }

    .category-hero__title {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-align: center;
    }

    .category-hero__subtitle {
      font-family: "Area", system-ui, -apple-system, sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 1rem;
      text-align: center;
    }

    .category-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.5rem, 1.5vw, 1rem);
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 6vw, 4rem) clamp(3rem, 8vw, 6rem);
    }

    .category-gallery__item {
      aspect-ratio: 4 / 5;
      background: var(--bg-btn);
      border-radius: 2px;
      overflow: hidden;
      border: 3px solid var(--gallery-border);
      cursor: pointer;
      transition: background-color 0.35s ease, border-color 0.35s ease;
    }

    .category-gallery__item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .category-gallery__item:hover img {
      transform: scale(1.03);
    }

    .category-nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0 clamp(1.5rem, 6vw, 4rem) clamp(3rem, 6vw, 5rem);
      flex-wrap: wrap;
    }

    .category-nav .btn {
      gap: 0.5rem;
    }

    .category-nav svg {
      width: 1rem;
      height: 1rem;
    }

    @media (max-width: 1024px) {
      .category-gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .category-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .category-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <svg class="noise-filter" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>

  <header class="header" id="header">
    <nav class="nav nav--left" data-i18n-aria="aria.nav" aria-label="Nawigacja">
      <a href="categories.html" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="width:1rem;height:1rem;margin-right:0.4rem" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        <span data-i18n="category.backToCategories">Kategorie</span>
      </a>
    </nav>

    <div class="nav nav--right">
      <a href="https://www.instagram.com/szymon_machnie_photo/" class="btn btn--icon" target="_blank"
        rel="noopener noreferrer" data-i18n-aria="aria.instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <button type="button" class="btn btn--icon" id="theme-toggle" data-i18n-aria="aria.theme"
        aria-label="Przełącz motyw">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="currentColor" />
          <path d="M12 3 A9 9 0 0 1 12 21 Z" class="theme-toggle-contrast" />
        </svg>
      </button>
      <button type="button" class="btn btn--lang" id="lang-toggle" data-i18n-aria="aria.lang" aria-label="Zmień język">
        <span class="lang-toggle__label">EN</span>
      </button>
    </div>
  </header>

  <div class="page" id="page">
    <main>
      <noscript>
        <div style="text-align:center;padding:4rem 2rem;">
          <h2 style="margin-bottom:1rem;">Wymagany JavaScript / JavaScript required</h2>
          <p>Aby przeglądać galerię, włącz obsługę JavaScript w przeglądarce.</p>
          <p style="margin-top:0.5rem;">To view the gallery, please enable JavaScript in your browser.</p>
          <p style="margin-top:1.5rem;"><a href="categories.html">← Wróć do kategorii / Back to categories</a></p>
          <hr style="margin:2rem auto;max-width:400px;border:none;border-top:1px solid #ccc;">
          <p style="margin-bottom:1rem;">Galerie / Galleries:</p>
          <ul style="list-style:none;padding:0;">
            <li><a href="category.html?cat=arctic">Arktyka / Arctic</a></li>
            <li><a href="category.html?cat=astro">Astro</a></li>
            <li><a href="category.html?cat=automotive">Samochody / Automotive</a></li>
            <li><a href="category.html?cat=blue">Niebiesko / Blue</a></li>
            <li><a href="category.html?cat=landscapes">Krajobrazy / Landscapes</a></li>
            <li><a href="category.html?cat=portraits">Portrety / Portraits</a></li>
            <li><a href="category.html?cat=other">Inne / Other</a></li>
          </ul>
        </div>
      </noscript>
      <section class="category-hero">
        <h1 class="category-hero__title" id="category-title">Kategoria</h1>
        <p class="category-hero__subtitle" id="category-subtitle"></p>
      </section>

      <div class="category-gallery" id="category-gallery"></div>

      <div class="category-nav">
        <a href="categories.html" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          <span data-i18n="category.allCategories">Wszystkie kategorie</span>
        </a>
        <a href="index.html" class="btn" data-i18n="category.mainPage">Strona główna</a>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__copy" data-i18n="footer.copy">&copy; <script>document.write(new Date().getFullYear())</script> Szymon Machnio</p>
    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria="aria.lightbox"
    aria-label="Powiększone zdjęcie">
    <div class="lightbox__toolbar">
      <span class="lightbox__counter" id="lightbox-counter"></span>
      <button type="button" class="lightbox__btn" id="lightbox-fullscreen" data-i18n-aria="aria.fullscreen"
        aria-label="Pełny ekran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3" />
        </svg>
      </button>
      <button type="button" class="lightbox__btn" id="lightbox-close" data-i18n-aria="aria.close" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <button type="button" class="lightbox__nav lightbox__prev" id="lightbox-prev" data-i18n-aria="aria.prev"
      aria-label="Poprzednie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div class="lightbox__img-wrap" id="lightbox-wrap">
      <img class="lightbox__img" id="lightbox-img" src="" alt="">
    </div>
    <button type="button" class="lightbox__nav lightbox__next" id="lightbox-next" data-i18n-aria="aria.next"
      aria-label="Następne">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>

  <script src="js/i18n.js"></script>
  <script>
    /* ── Theme ── */
    const storageKey = "szymon-machnio-theme";
    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    }
    function getPreferredTheme() {
      const stored = localStorage.getItem(storageKey);
      if (stored === "dark" || stored === "light") return stored;
      return "light";
    }
    applyTheme(getPreferredTheme());
    document.getElementById("theme-toggle").addEventListener("click", () => {
      const isDark = document.documentElement.hasAttribute("data-theme");
      const next = isDark ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem(storageKey, next);
    });

    /* ── i18n ── */
    initI18n();

    /* ── Ordinal helper ── */
    const ordinals = [
      "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth",
      "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth",
      "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth"
    ];

    /* ── Category Data ── */
    const basePath = "assets/images/Works/";
    const categories = {
      arctic: {
        titleKey: "cat.arctic.name",
        subtitleKey: "cat.arctic.subtitle",
        folder: "arctic",
        count: 18
      },
      astro: {
        titleKey: "cat.astro.name",
        subtitleKey: "cat.astro.subtitle",
        folder: "astro",
        count: 9
      },
      automotive: {
        titleKey: "cat.automotive.name",
        subtitleKey: "cat.automotive.subtitle",
        folder: "automotive",
        count: 19
      },
      blue: {
        titleKey: "cat.blue.name",
        subtitleKey: "cat.blue.subtitle",
        folder: "blue",
        count: 11
      },
      landscapes: {
        titleKey: "cat.landscapes.name",
        subtitleKey: "cat.landscapes.subtitle",
        folder: "landscapes",
        count: 14
      },
      portraits: {
        titleKey: "cat.portraits.name",
        subtitleKey: "cat.portraits.subtitle",
        folder: "portraits",
        count: 7
      },
      other: {
        titleKey: "cat.other.name",
        subtitleKey: "cat.other.subtitle",
        folder: "other",
        count: 16
      }
    };

    /* ── Special file lists for folders with non-standard naming ── */
    const specialFiles = {
      astro: [
        "first", "second", "third", "fourth", "fifth", "sixth", "eighth", "nineth", "tenth"
      ],
      landscapes: [
        "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth",
        "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "eleventh"
      ]
    };

    /* ── Render Gallery ── */
    const params = new URLSearchParams(window.location.search);
    const catKey = params.get("cat");
    const cat = categories[catKey];

    const titleEl = document.getElementById("category-title");
    const subtitleEl = document.getElementById("category-subtitle");
    const galleryEl = document.getElementById("category-gallery");

    const imageSources = [];

    if (cat) {
      titleEl.textContent = t(cat.titleKey);
      subtitleEl.textContent = t(cat.subtitleKey);
      document.title = t(cat.titleKey) + " — Szymon Machnio";

      const catTitle = t(cat.titleKey);
      const fileList = specialFiles[catKey]
        ? specialFiles[catKey]
        : ordinals.slice(0, cat.count);

      fileList.forEach((name, i) => {
        const src = basePath + cat.folder + "/" + name + ".webp";
        const alt = catTitle + " " + (i + 1);
        imageSources.push({ src, alt });

        const item = document.createElement("div");
        item.className = "category-gallery__item";
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");
        item.setAttribute("aria-label", alt);
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        img.loading = "lazy";
        img.addEventListener("error", function () {
          item.remove();
          // Remove from imageSources so lightbox indexes stay correct
          const idx = imageSources.findIndex(s => s.src === src);
          if (idx !== -1) imageSources.splice(idx, 1);
          // Re-bind click indexes after removal
          rebindGalleryClicks();
        });
        item.appendChild(img);
        galleryEl.appendChild(item);

        item.addEventListener("click", () => openLightbox(i));
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openLightbox(i);
          }
        });
      });

      /* ── Inject JSON-LD structured data for SEO ── */
      const jsonLd = {
        "@context": "https://schema.org",
        "@type": "ImageGallery",
        "name": catTitle + " — Szymon Machnio Photography",
        "description": t(cat.subtitleKey),
        "author": {
          "@type": "Person",
          "name": "Szymon Machnio"
        },
        "image": imageSources.map(s => s.src)
      };
      const ldScript = document.createElement("script");
      ldScript.type = "application/ld+json";
      ldScript.textContent = JSON.stringify(jsonLd);
      document.head.appendChild(ldScript);
    } else {
      titleEl.textContent = t("category.notFound");
      subtitleEl.textContent = t("category.notFoundDesc");
    }

    /* Re-bind gallery click events after an image is removed */
    function rebindGalleryClicks() {
      const items = galleryEl.querySelectorAll(".category-gallery__item");
      items.forEach((item, i) => {
        // Clone to remove old listeners
        const newItem = item.cloneNode(true);
        item.parentNode.replaceChild(newItem, item);
        newItem.addEventListener("click", () => openLightbox(i));
        newItem.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openLightbox(i);
          }
        });
      });
    }

    // Update title and subtitle on lang change
    function updateCategoryTexts() {
      if (cat) {
        titleEl.textContent = t(cat.titleKey);
        subtitleEl.textContent = t(cat.subtitleKey);
        document.title = t(cat.titleKey) + " — Szymon Machnio";
      } else {
        titleEl.textContent = t("category.notFound");
        subtitleEl.textContent = t("category.notFoundDesc");
      }
    }

    document.addEventListener("langchange", updateCategoryTexts);

    /* ── Lightbox ── */
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxWrap = document.getElementById("lightbox-wrap");
    const lightboxClose = document.getElementById("lightbox-close");
    const lightboxPrev = document.getElementById("lightbox-prev");
    const lightboxNext = document.getElementById("lightbox-next");
    const lightboxFullscreen = document.getElementById("lightbox-fullscreen");
    const lightboxCounter = document.getElementById("lightbox-counter");

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxImage();
      lightbox.classList.add("lightbox--open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("lightbox--open");
      document.body.style.overflow = "";
      if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
    }

    function updateLightboxImage() {
      const data = imageSources[currentIndex];
      if (!data) return;
      lightboxImg.src = data.src;
      lightboxImg.alt = data.alt;
      lightboxCounter.textContent = (currentIndex + 1) + " / " + imageSources.length;
      lightboxPrev.style.display = imageSources.length > 1 ? "" : "none";
      lightboxNext.style.display = imageSources.length > 1 ? "" : "none";
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + imageSources.length) % imageSources.length;
      updateLightboxImage();
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % imageSources.length;
      updateLightboxImage();
    }

    /* ── Fullscreen ── */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        lightbox.requestFullscreen().catch(() => { });
      } else {
        document.exitFullscreen().catch(() => { });
      }
    }

    /* ── Event Listeners ── */
    lightboxClose.addEventListener("click", (e) => { e.stopPropagation(); closeLightbox(); });
    lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); showPrev(); });
    lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); showNext(); });
    lightboxFullscreen.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightboxWrap) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("lightbox--open")) return;
      switch (e.key) {
        case "Escape": closeLightbox(); break;
        case "ArrowLeft": showPrev(); break;
        case "ArrowRight": showNext(); break;
        case "f": case "F": toggleFullscreen(); break;
      }
    });

    /* ── Touch swipe ── */
    let touchStartX = 0, touchStartY = 0;
    lightboxWrap.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    lightboxWrap.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx > 0) showPrev(); else showNext();
      }
    }, { passive: true });
  </script>
</body>

</html>
