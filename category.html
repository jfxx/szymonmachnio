<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galeria kategorii — Szymon Machnio Fotografia">
  <title>Kategoria — Szymon Machnio</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .category-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 45vh;
      padding: clamp(7rem, 14vw, 11rem) clamp(1.5rem, 6vw, 4rem) clamp(2rem, 6vw, 3rem);
    }

    .category-hero__title {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-align: center;
    }

    .category-hero__subtitle {
      font-family: "Area", system-ui, -apple-system, sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 1rem;
      text-align: center;
    }

    .category-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.5rem, 1.5vw, 1rem);
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 6vw, 4rem) clamp(3rem, 8vw, 6rem);
    }

    .category-gallery__item {
      aspect-ratio: 4 / 5;
      background: var(--bg-btn);
      border-radius: 2px;
      overflow: hidden;
      border: 3px solid var(--gallery-border);
      cursor: pointer;
      transition: background-color 0.35s ease, border-color 0.35s ease;
    }

    .category-gallery__item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .category-gallery__item:hover img {
      transform: scale(1.03);
    }

    .category-nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0 clamp(1.5rem, 6vw, 4rem) clamp(3rem, 6vw, 5rem);
      flex-wrap: wrap;
    }

    .category-nav .btn {
      gap: 0.5rem;
    }

    .category-nav svg {
      width: 1rem;
      height: 1rem;
    }

    @media (max-width: 1024px) {
      .category-gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .category-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .category-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <svg class="noise-filter" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </svg>

  <header class="header" id="header">
    <nav class="nav nav--left" aria-label="Nawigacja">
      <a href="categories.html" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1rem;height:1rem;margin-right:0.4rem" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Kategorie
      </a>
    </nav>

    <div class="nav nav--right">
      <a
        href="https://instagram.com"
        class="btn btn--icon"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <button
        type="button"
        class="btn btn--icon"
        id="theme-toggle"
        aria-label="Odwróć motyw"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="currentColor"/>
          <path d="M12 3 A9 9 0 0 1 12 21 Z" class="theme-toggle-contrast"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="page" id="page">
    <main>
      <section class="category-hero">
        <h1 class="category-hero__title" id="category-title">Kategoria</h1>
        <p class="category-hero__subtitle" id="category-subtitle"></p>
      </section>

      <div class="category-gallery" id="category-gallery"></div>

      <div class="category-nav">
        <a href="categories.html" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          Wszystkie kategorie
        </a>
        <a href="index.html" class="btn">
          Strona główna
        </a>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__copy">&copy; 2026 Szymon Machnio</p>
    </footer>
  </div>

  <!-- Enhanced Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Powiększone zdjęcie">
    <div class="lightbox__toolbar">
      <span class="lightbox__counter" id="lightbox-counter"></span>
      <button type="button" class="lightbox__btn" id="lightbox-zoom" aria-label="Powiększ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
        </svg>
      </button>
      <button type="button" class="lightbox__btn" id="lightbox-fullscreen" aria-label="Pełny ekran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/>
        </svg>
      </button>
      <button type="button" class="lightbox__btn" id="lightbox-close" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <button type="button" class="lightbox__nav lightbox__prev" id="lightbox-prev" aria-label="Poprzednie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="lightbox__img-wrap" id="lightbox-wrap">
      <img class="lightbox__img" id="lightbox-img" src="" alt="">
    </div>
    <button type="button" class="lightbox__nav lightbox__next" id="lightbox-next" aria-label="Następne">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

  <script>
    /* ── Theme ── */
    const storageKey = "szymon-machnio-theme";
    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    }
    function getPreferredTheme() {
      const stored = localStorage.getItem(storageKey);
      if (stored === "dark" || stored === "light") return stored;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    applyTheme(getPreferredTheme());
    document.getElementById("theme-toggle").addEventListener("click", () => {
      const isDark = document.documentElement.hasAttribute("data-theme");
      const next = isDark ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem(storageKey, next);
    });

    /* ── Ordinal helper ── */
    const ordinals = [
      "first","second","third","fourth","fifth","sixth","seventh","eighth",
      "ninth","tenth","eleventh","twelfth","thirteenth","fourteenth",
      "fifteenth","sixteenth","seventeenth","eighteenth","nineteenth","twentieth"
    ];

    /* ── Category Data ── */
    const basePath = "assets/images/Works/";
    const categories = {
      arctic: {
        title: "Arctic",
        subtitle: "Fotografia z arktycznych krajobrazów",
        folder: "arctic",
        count: 18
      },
      astro: {
        title: "Astro",
        subtitle: "Astrofotografia — gwiazdy i nocne niebo",
        folder: "astro",
        count: 9
      },
      automotive: {
        title: "Automotive",
        subtitle: "Fotografia motoryzacyjna",
        folder: "automotive",
        count: 19
      },
      blue: {
        title: "Blue",
        subtitle: "Błękitne tonacje i nastroje",
        folder: "blue",
        count: 11
      },
      landscapes: {
        title: "Landscapes",
        subtitle: "Krajobrazy i przyroda",
        folder: "landscapes",
        count: 14
      },
      portraits: {
        title: "Portraits",
        subtitle: "Fotografia portretowa",
        folder: "portraits",
        count: 7
      },
      other: {
        title: "Other",
        subtitle: "Pozostałe prace",
        folder: "other",
        count: 16
      }
    };

    /* ── Special file lists for folders with non-standard naming ── */
    const specialFiles = {
      astro: [
        "first","second","third","fourth","fifth","sixth","eighth","nineth","tenth"
      ],
      landscapes: [
        "first","second","third","fourth","fifth","sixth","seventh","eighth",
        "twelfth","thirteenth","fourteenth","fifteenth","sixteenth","eleventh"
      ]
    };

    /* ── Render Gallery ── */
    const params = new URLSearchParams(window.location.search);
    const catKey = params.get("cat");
    const cat = categories[catKey];

    const titleEl = document.getElementById("category-title");
    const subtitleEl = document.getElementById("category-subtitle");
    const galleryEl = document.getElementById("category-gallery");

    const imageSources = [];

    if (cat) {
      titleEl.textContent = cat.title;
      subtitleEl.textContent = cat.subtitle;
      document.title = cat.title + " — Szymon Machnio";

      const fileList = specialFiles[catKey]
        ? specialFiles[catKey]
        : ordinals.slice(0, cat.count);

      fileList.forEach((name, i) => {
        const src = basePath + cat.folder + "/" + name + ".webp";
        const alt = cat.title + " " + (i + 1);
        imageSources.push({ src, alt });

        const item = document.createElement("div");
        item.className = "category-gallery__item";
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");
        item.setAttribute("aria-label", alt);
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        img.loading = "lazy";
        item.appendChild(img);
        galleryEl.appendChild(item);

        item.addEventListener("click", () => openLightbox(i));
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openLightbox(i);
          }
        });
      });
    } else {
      titleEl.textContent = "Nie znaleziono kategorii";
      subtitleEl.textContent = "Sprawdź adres URL lub wróć do kategorii.";
    }

    /* ── Enhanced Lightbox ── */
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxWrap = document.getElementById("lightbox-wrap");
    const lightboxClose = document.getElementById("lightbox-close");
    const lightboxPrev = document.getElementById("lightbox-prev");
    const lightboxNext = document.getElementById("lightbox-next");
    const lightboxZoom = document.getElementById("lightbox-zoom");
    const lightboxFullscreen = document.getElementById("lightbox-fullscreen");
    const lightboxCounter = document.getElementById("lightbox-counter");

    let currentIndex = 0;
    let isZoomed = false;

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxImage();
      lightbox.classList.add("lightbox--open");
      document.body.style.overflow = "hidden";
      resetZoom();
    }

    function closeLightbox() {
      lightbox.classList.remove("lightbox--open");
      document.body.style.overflow = "";
      resetZoom();
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }

    function updateLightboxImage() {
      const data = imageSources[currentIndex];
      if (!data) return;
      lightboxImg.src = data.src;
      lightboxImg.alt = data.alt;
      lightboxCounter.textContent = (currentIndex + 1) + " / " + imageSources.length;
      lightboxPrev.style.display = imageSources.length > 1 ? "" : "none";
      lightboxNext.style.display = imageSources.length > 1 ? "" : "none";
    }

    function showPrev() {
      resetZoom();
      currentIndex = (currentIndex - 1 + imageSources.length) % imageSources.length;
      updateLightboxImage();
    }

    function showNext() {
      resetZoom();
      currentIndex = (currentIndex + 1) % imageSources.length;
      updateLightboxImage();
    }

    /* ── Zoom ── */
    function toggleZoom() {
      if (isZoomed) {
        resetZoom();
      } else {
        isZoomed = true;
        lightboxWrap.classList.add("lightbox__img-wrap--zoomed");
        lightboxImg.style.width = lightboxImg.naturalWidth + "px";
        lightboxImg.style.height = lightboxImg.naturalHeight + "px";
        const ww = lightboxWrap.clientWidth;
        const wh = lightboxWrap.clientHeight;
        lightboxWrap.scrollLeft = (lightboxImg.offsetWidth - ww) / 2;
        lightboxWrap.scrollTop = (lightboxImg.offsetHeight - wh) / 2;
      }
    }

    function resetZoom() {
      isZoomed = false;
      lightboxWrap.classList.remove("lightbox__img-wrap--zoomed");
      lightboxImg.style.width = "";
      lightboxImg.style.height = "";
      lightboxWrap.scrollLeft = 0;
      lightboxWrap.scrollTop = 0;
    }

    /* ── Zoom drag ── */
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let scrollStartX = 0, scrollStartY = 0;

    lightboxWrap.addEventListener("mousedown", (e) => {
      if (!isZoomed) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      scrollStartX = lightboxWrap.scrollLeft;
      scrollStartY = lightboxWrap.scrollTop;
      e.preventDefault();
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      lightboxWrap.scrollLeft = scrollStartX - (e.clientX - dragStartX);
      lightboxWrap.scrollTop = scrollStartY - (e.clientY - dragStartY);
    });

    window.addEventListener("mouseup", () => { isDragging = false; });

    /* ── Fullscreen ── */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        lightbox.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    /* ── Event Listeners ── */
    lightboxClose.addEventListener("click", (e) => { e.stopPropagation(); closeLightbox(); });
    lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); showPrev(); });
    lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); showNext(); });
    lightboxZoom.addEventListener("click", (e) => { e.stopPropagation(); toggleZoom(); });
    lightboxFullscreen.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightboxWrap) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("lightbox--open")) return;
      switch (e.key) {
        case "Escape": closeLightbox(); break;
        case "ArrowLeft": showPrev(); break;
        case "ArrowRight": showNext(); break;
        case "f": case "F": toggleFullscreen(); break;
        case "z": case "Z": toggleZoom(); break;
      }
    });

    /* ── Touch swipe ── */
    let touchStartX = 0, touchStartY = 0;
    lightboxWrap.addEventListener("touchstart", (e) => {
      if (isZoomed) return;
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    lightboxWrap.addEventListener("touchend", (e) => {
      if (isZoomed) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx > 0) showPrev(); else showNext();
      }
    }, { passive: true });
  </script>
</body>
</html>
