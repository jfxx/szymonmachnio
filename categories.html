<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kategorie fotografii — Szymon Machnio">
  <title>Szymon Machnio - Kategorie</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .categories-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      padding: clamp(7rem, 14vw, 11rem) clamp(1.5rem, 6vw, 4rem) clamp(2rem, 6vw, 3rem);
    }

    .categories-hero__title {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: clamp(2.25rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-align: center;
    }

    .categories-hero__subtitle {
      font-family: "Area", system-ui, -apple-system, sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 1rem;
      text-align: center;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(0.75rem, 2vw, 1.25rem);
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 6vw, 4rem) clamp(1rem, 2vw, 1.5rem);
    }

    .categories-grid--bottom {
      grid-template-columns: repeat(4, 1fr);
      padding-top: 0;
      padding-bottom: clamp(4rem, 10vw, 7rem);
    }

    .category-card {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 2px;
      overflow: hidden;
      border: 3px solid var(--gallery-border);
      text-decoration: none;
      color: #fff;
      display: block;
      transition: border-color 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .category-card:hover {
      transform: translateY(-4px);
    }

    .category-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .category-card:hover .category-card__img {
      transform: scale(1.05);
    }

    .category-card__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.2) 40%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(1.25rem, 3vw, 2rem);
      transition: background 0.35s ease;
    }

    .category-card:hover .category-card__overlay {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.1) 100%);
    }

    .category-card__name {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .category-card__count {
      font-family: "Area", system-ui, -apple-system, sans-serif;
      font-size: clamp(0.65rem, 1.5vw, 0.85rem);
      font-weight: 700;
      opacity: 0.7;
      margin-top: 0.3rem;
    }

    .categories-back {
      text-align: center;
      padding: 0 clamp(1.5rem, 6vw, 4rem) clamp(3rem, 6vw, 5rem);
    }

    .categories-back .btn {
      gap: 0.5rem;
    }

    .categories-back svg {
      width: 1rem;
      height: 1rem;
    }

    @media (max-width: 900px) {
      .categories-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .categories-grid--bottom {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {

      .categories-grid,
      .categories-grid--bottom {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <svg class="noise-filter" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>

  <header class="header" id="header">
    <nav class="nav nav--left" data-i18n-aria="aria.nav" aria-label="Nawigacja">
      <a href="index.html" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="width:1rem;height:1rem;margin-right:0.4rem" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        <span data-i18n="categories.return">Powrót</span>
      </a>
    </nav>

    <div class="nav nav--right">
      <a href="https://www.instagram.com/szymon_machnie_photo/" class="btn btn--icon" target="_blank"
        rel="noopener noreferrer" data-i18n-aria="aria.instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <button type="button" class="btn btn--icon" id="theme-toggle" data-i18n-aria="aria.theme"
        aria-label="Przełącz motyw">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="currentColor" />
          <path d="M12 3 A9 9 0 0 1 12 21 Z" class="theme-toggle-contrast" />
        </svg>
      </button>
      <button type="button" class="btn btn--lang" id="lang-toggle" data-i18n-aria="aria.lang" aria-label="Zmień język">
        <span class="lang-toggle__label">EN</span>
      </button>
    </div>
  </header>

  <div class="page" id="page">
    <main>
      <section class="categories-hero">
        <h1 class="categories-hero__title" data-i18n="categories.title">Kategorie</h1>
        <p class="categories-hero__subtitle" data-i18n="categories.subtitle">Wybierz kategorię, aby zobaczyć pełną
          galerię</p>
      </section>

      <!-- row 1: 3 cards -->
      <div class="categories-grid">
        <a href="category.html?cat=arctic" class="category-card" aria-label="Arctic">
          <img src="assets/images/Works/arctic.webp" alt="Arctic" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.arctic.name">Arktyka</span>
            <span class="category-card__count" data-count="18">18 zdjęć</span>
          </div>
        </a>

        <a href="category.html?cat=astro" class="category-card" aria-label="Astro">
          <img src="assets/images/Works/astro.webp" alt="Astro" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.astro.name">Astro</span>
            <span class="category-card__count" data-count="9">9 zdjęć</span>
          </div>
        </a>

        <a href="category.html?cat=automotive" class="category-card" aria-label="Automotive">
          <img src="assets/images/Works/automotive.webp" alt="Automotive" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.automotive.name">Samochody</span>
            <span class="category-card__count" data-count="19">19 zdjęć</span>
          </div>
        </a>
      </div>

      <!-- row 2: 4 cards -->
      <div class="categories-grid categories-grid--bottom">
        <a href="category.html?cat=blue" class="category-card" aria-label="Blue">
          <img src="assets/images/Works/blue.webp" alt="Blue" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.blue.name">Niebiesko</span>
            <span class="category-card__count" data-count="11">11 zdjęć</span>
          </div>
        </a>

        <a href="category.html?cat=landscapes" class="category-card" aria-label="Landscapes">
          <img src="assets/images/Works/landscapes.webp" alt="Landscapes" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.landscapes.name">Krajobrazy</span>
            <span class="category-card__count" data-count="14">14 zdjęć</span>
          </div>
        </a>

        <a href="category.html?cat=portraits" class="category-card" aria-label="Portraits">
          <img src="assets/images/Works/portrait.webp" alt="Portraits" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.portraits.name">Portrety</span>
            <span class="category-card__count" data-count="7">7 zdjęć</span>
          </div>
        </a>

        <a href="category.html?cat=other" class="category-card" aria-label="Other">
          <img src="assets/images/Works/other.webp" alt="Other" class="category-card__img" loading="lazy">
          <div class="category-card__overlay">
            <span class="category-card__name" data-i18n="cat.other.name">Inne</span>
            <span class="category-card__count" data-count="16">16 zdjęć</span>
          </div>
        </a>
      </div>

      <div class="categories-back">
        <a href="index.html" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          <span data-i18n="categories.back">Strona główna</span>
        </a>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__copy" data-i18n="footer.copy">&copy; 2026 Szymon Machnio</p>
    </footer>
  </div>

  <script src="js/i18n.js"></script>
  <script>
    /* ── Theme ── */
    const storageKey = "szymon-machnio-theme";
    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    }
    function getPreferredTheme() {
      const stored = localStorage.getItem(storageKey);
      if (stored === "dark" || stored === "light") return stored;
      return "light";
    }
    applyTheme(getPreferredTheme());
    document.getElementById("theme-toggle").addEventListener("click", () => {
      const isDark = document.documentElement.hasAttribute("data-theme");
      const next = isDark ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem(storageKey, next);
    });

    /* ── i18n ── */
    initI18n();

    // Update photo counts when language changes
    function updatePhotoCounts() {
      const lang = getSavedLang();
      const word = lang === "pl" ? "zdjęć" : "photos";
      document.querySelectorAll(".category-card__count[data-count]").forEach(el => {
        el.textContent = el.getAttribute("data-count") + " " + word;
      });
    }
    updatePhotoCounts();

    document.addEventListener("langchange", updatePhotoCounts);
  </script>
</body>

</html>
